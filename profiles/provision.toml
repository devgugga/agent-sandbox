# Configuracao do host copiada para dentro do sandbox a cada `up`.
#
# A lista e EXPLICITA de proposito. `~/.claude` contem `.credentials.json` e
# `~/.codex` contem `auth.json`: declarar o diretorio inteiro entregaria a
# credencial do seu host ao sandbox, que e exatamente o que a imagem
# autenticada existe para evitar. O provisionador recusa qualquer entrada que
# contenha um caminho negado, inclusive dentro de diretorios.

[[entry]]
src = "~/.claude/settings.json"
dst = "~/.claude/settings.json"
# hooks e statusLine apontam para caminhos do host que nao existem no
# container; sem o filtro o agente erra a cada sessao.
filter = "claude-settings"

[[entry]]
src = "~/.claude/plugins"
dst = "~/.claude/plugins"

[[entry]]
src = "~/.claude/skills"
dst = "~/.claude/skills"

[[entry]]
src = "~/.codex/config.toml"
dst = "~/.codex/config.toml"
filter = "codex-config"

[[entry]]
src = "~/.codex/hooks.json"
dst = "~/.codex/hooks.json"

# O Codex tem sistema de plugins e skills PROPRIO, separado do Claude.
[[entry]]
src = "~/.codex/plugins"
dst = "~/.codex/plugins"

[[entry]]
src = "~/.codex/skills"
dst = "~/.codex/skills"

[[entry]]
src = "~/.gemini/antigravity-cli/settings.json"
dst = "~/.gemini/antigravity-cli/settings.json"

# O Antigravity guarda plugins, skills, hooks e MCPs separadamente das
# preferencias do CLI. Tudo continua numa allowlist explicita: projetos,
# sessoes e credenciais nunca sao copiados por arrasto.
[[entry]]
src = "~/.gemini/config/config.json"
dst = "~/.gemini/config/config.json"

[[entry]]
src = "~/.gemini/config/hooks.json"
dst = "~/.gemini/config/hooks.json"

[[entry]]
src = "~/.gemini/config/mcp_config.json"
dst = "~/.gemini/config/mcp_config.json"

[[entry]]
src = "~/.gemini/config/import_manifest.json"
dst = "~/.gemini/config/import_manifest.json"

[[entry]]
src = "~/.gemini/config/plugins"
dst = "~/.gemini/config/plugins"

[[entry]]
src = "~/.gemini/config/skills"
dst = "~/.gemini/config/skills"
