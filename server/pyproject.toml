[project]
name = "asb_server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "asb",
]

[project.scripts]
asb-server = "asb_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asb_server"]

[tool.uv.sources]
asb = { workspace = true }

[dependency-groups]
dev = ["pytest", "httpx"]
